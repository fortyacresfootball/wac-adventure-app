<style>

.tracking-page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 38px 24px 70px;
}

.tracking-header {
    margin-bottom: 28px;
}

.tracking-header h1 {
    margin: 0 0 8px;
    font-size: clamp(2rem, 5vw, 3.2rem);
    color: #123b25;
}

.tracking-header p {
    margin: 0;
    font-size: 1.05rem;
    line-height: 1.6;
    color: #59645d;
}

.tracking-card {
    background: #ffffff;
    border: 1px solid rgba(18, 59, 37, 0.16);
    border-radius: 22px;
    padding: 28px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
}

.tracking-card label {
    display: block;
    margin-bottom: 8px;
    font-weight: 800;
    color: #123b25;
}

#tracking-type {
    width: 100%;
    max-width: 360px;
    min-height: 48px;
    padding: 10px 12px;
    border: 1px solid #a7afa9;
    border-radius: 10px;
    font-size: 1rem;
    background: #ffffff;
}

.tracking-status-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin: 28px 0;
}

.tracking-status-grid > div {
    background: #f4f0e4;
    border-radius: 15px;
    padding: 18px;
}

.tracking-status-grid span {
    display: block;
    margin-bottom: 6px;
    font-size: 0.8rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6b746e;
}

.tracking-status-grid strong {
    display: block;
    font-size: 1.35rem;
    color: #123b25;
}

.tracking-actions {
    display: grid;
    grid-template-columns: 1fr 1.5fr 1fr;
    gap: 12px;
    margin-bottom: 22px;
}

.tracking-actions button {
    min-height: 58px;
    border: 0;
    border-radius: 13px;
    padding: 12px 18px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
}

#tracking-start-button {
    background: #123b25;
    color: #ffffff;
}

#tracking-waypoint-button {
    background: #d4a82d;
    color: #172018;
}

#tracking-end-button {
    background: #7d3029;
    color: #ffffff;
}

.tracking-actions button:disabled {
    opacity: 0.38;
    cursor: not-allowed;
}

.tracking-gps-status {
    background: #edf2ed;
    border-left: 5px solid #123b25;
    border-radius: 8px;
    padding: 14px 16px;
    font-weight: 700;
    color: #35423a;
}

.tracking-waypoints {
    margin-top: 22px;
    display: grid;
    gap: 10px;
}

.tracking-waypoint-item {
    padding: 16px;
    background: #f7f4eb;
    border: 1px solid #ddd7c7;
    border-radius: 12px;
    line-height: 1.5;
}

.tracking-waypoint-item strong {
    color: #123b25;
}

@media (max-width: 720px) {

    .tracking-page {
        padding: 24px 16px 60px;
    }

    .tracking-card {
        padding: 18px;
    }

    .tracking-status-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .tracking-actions {
        grid-template-columns: 1fr;
    }

    .tracking-actions button {
        width: 100%;
        min-height: 62px;
        font-size: 1.05rem;
    }

}

</style>

<section class="tracking-page">

  <div class="tracking-header">
    <h1>WAC Tracker</h1>
    <p>
      Record a route, mark waypoints, and save the completed track.
    </p>
  </div>


  <div class="tracking-card">

    <label for="tracking-type">
      Track Type
    </label>

    <select id="tracking-type">
      <option value="Blood Trail">Blood Trail</option>
      <option value="Scouting">Scouting</option>
      <option value="Hiking">Hiking</option>
      <option value="Property Walk">Property Walk</option>
      <option value="Recovery">Recovery</option>
      <option value="Other">Other</option>
    </select>


    <div class="tracking-status-grid">

      <div>
        <span>Status</span>
        <strong id="tracking-status">
          Ready
        </strong>
      </div>

      <div>
        <span>Elapsed</span>
        <strong id="tracking-elapsed">
          00:00:00
        </strong>
      </div>

      <div>
        <span>Distance</span>
        <strong id="tracking-distance">
          0.00 mi
        </strong>
      </div>

      <div>
        <span>Waypoints</span>
        <strong id="tracking-waypoint-count">
          0
        </strong>
      </div>

    </div>


    <div class="tracking-actions">

      <button
        id="tracking-start-button"
        type="button"
      >
        Start Tracking
      </button>

      <button
        id="tracking-waypoint-button"
        type="button"
        disabled
      >
        Add Waypoint
      </button>

      <button
        id="tracking-end-button"
        type="button"
        disabled
      >
        End Track
      </button>

    </div>


    <div
      id="tracking-gps-status"
      class="tracking-gps-status"
    >
      GPS has not started.
    </div>


    <div
      id="tracking-waypoints"
      class="tracking-waypoints"
    ></div>

  </div>

</section>
