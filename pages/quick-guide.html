<section class="page-section page-enter quick-guide-page">

    <div class="container">

        <div class="profile-back-row">

            <a
                href="#"
                class="profile-back-link"
                data-page="adventures">

                ← Back to Adventures

            </a>

        </div>

        <div class="page-header">

            <div>

                <div class="eyebrow">
                    Fast Reference
                </div>

                <h1 class="section-title">
                    WAC Adventure Quick Guide
                </h1>

                <p class="section-subtitle">
                    Review every adventure title and mission without opening each full adventure.
                </p>

            </div>

            <div
                id="quickGuideCount"
                class="chip">

                Loading...

            </div>

        </div>

        <div class="toolbar quick-guide-toolbar">

            <input
                id="quickGuideSearch"
                class="search-input"
                type="search"
                placeholder="Search titles, missions, or categories...">

            <select
                id="quickGuideCategory"
                class="filter-select">

                <option value="">
                    All Categories
                </option>

            </select>

            <button
                id="printQuickGuide"
                class="small-button"
                type="button">

                Print Guide

            </button>

        </div>

        <div
            id="quickGuideList"
            class="quick-guide-list">
        </div>

        <div
            id="quickGuideEmpty"
            class="empty-state hidden">

            <h3>
                No Adventures Found
            </h3>

            <p>
                Try a different search term or category.
            </p>

        </div>

    </div>

</section>
