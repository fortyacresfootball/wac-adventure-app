<div id="drawerOverlay" class="drawer-overlay">

    <aside id="drawer" class="drawer">

        <button
            id="drawerClose"
            class="drawer-close">

            ✕

        </button>

        <!-- ====================================== -->
        <!-- Header -->
        <!-- ====================================== -->

        <header class="drawer-header">

            <img
                id="drawerBadge"
                class="drawer-badge"
                src="assets/badges/B-01.webp"
                alt="Adventure Badge">

            <div class="drawer-header-info">

                <span
                    id="drawerCategory"
                    class="drawer-category">

                    Category

                </span>

                <h2 id="drawerTitle">

                    Adventure Title

                </h2>

                <div class="drawer-chip-row">

    <div
        id="drawerPoints"
        class="chip">

        100 Points

    </div>

    <div
        id="drawerStatus"
        class="chip">

        Available

    </div>

</div>

<div class="drawer-summary">

    <div class="summary-item">

        ⭐
        <span id="drawerDifficultyHeader">
            Moderate
        </span>

    </div>

    <div class="summary-item">

        ⏱
        <span id="drawerTimeHeader">
            2 Hours
        </span>

    </div>

    <div class="summary-item">

        📍
        <span id="drawerLocationHeader">
            WAC Property
        </span>

    </div>

    <div class="summary-item">

        🌲
        <span id="drawerSeasonHeader">
            All Seasons
        </span>

    </div>

</div>

            </div>

        </header>

        <!-- ====================================== -->
        <!-- Adventure Overview -->
        <!-- ====================================== -->

        <section class="drawer-section">

            <h3>Adventure Overview</h3>

            <p id="drawerVibe">

                Adventure overview...

            </p>

        </section>

                        <!-- ====================================== -->
        <!-- Adventure Stats -->
        <!-- ====================================== -->

        <section class="drawer-section">

            <div class="stats-grid stats-grid-two">

                <div class="stat-card">

                    <div
                        id="drawerType"
                        class="stat-number">

                        Outdoor

                    </div>

                    <div class="stat-label">

                        Adventure Type

                    </div>

                </div>

                <div class="stat-card">

                    <div
                        id="drawerAge"
                        class="stat-number">

                        All Ages

                    </div>

                    <div class="stat-label">

                        Minimum Age

                    </div>

                </div>

            </div>

        </section>

        <!-- ====================================== -->
        <!-- Mission -->
        <!-- ====================================== -->

        <section class="drawer-section mission-card">

    <h3>🧭 Mission</h3>

            <p id="drawerMission"></p>

        </section>

        <!-- ====================================== -->
        <!-- Why It Matters -->
        <!-- ====================================== -->

        <section class="drawer-section why-card">

    <h3>⭐ Why It Matters</h3>

            <p id="drawerWhy"></p>

        </section>

        <!-- ====================================== -->
        <!-- President's Note -->
        <!-- ====================================== -->

        <section class="drawer-section note-card">

    <h3>💬 President's Note</h3>

            <p id="drawerNote"></p>

        </section>

        <!-- ====================================== -->
        <!-- Required Equipment -->
        <!-- ====================================== -->

        <section class="drawer-section">

    <h3>Required Equipment</h3>

    <div id="drawerEquipment" class="drawer-list">

    </div>

</section>

<section class="drawer-section">

    <h3>Prerequisites</h3>

    <div id="drawerPrerequisite" class="drawer-list">

    </div>

</section>

        <!-- ====================================== -->
        <!-- Footer -->
        <!-- ====================================== -->

        <footer class="drawer-footer">

            <button
                id="completeAdventure"
                class="button">

                Complete Adventure

            </button>

        </footer>

    </aside>

</div>
